<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Админ-панель | Estética</title>
    <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Poiret One',cursive;
            background:#D56989;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:15px;
            font-size:18px;
            color:#111111;
        }
        .frame{
            max-width:1400px;
            width:100%;
            background:#F3EEF1;
            padding:25px;
            border-radius:32px;
            border: 3px solid #C2DC80;
        }
        
        /* ШАПКА — ПРОЗРАЧНАЯ */
        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:15px;
            margin-bottom:25px;
            padding:20px 15px;
            background: transparent;
            position:relative;
            border-radius:24px;
        }
        .header::before {
            display: none;
        }
        
        .logo{
            font-size:32px;
            font-weight:800;
            text-decoration:none;
            letter-spacing:2px;
            color:#111111 !important;
        }
        
        .nav{
            display:flex;
            flex-wrap:wrap;
            gap:25px;
            justify-content:center;
        }
        .nav a{
            text-decoration:none;
            font-size:16px;
            font-weight:600;
            padding:8px 0;
            white-space:nowrap;
            transition:0.2s;
            letter-spacing:1px;
            color:#111111 !important;
        }
        .nav a:hover {
            background: rgba(0,0,0,0.05);
            border-radius:30px;
            padding:8px 12px;
        }
        
        .admin-title{
            font-size:32px;
            color:#111111;
            margin-bottom:20px;
            border-left:4px solid #C2DC80;
            padding-left:15px;
            letter-spacing:1px;
        }
        
        .access-denied{
            text-align:center;
            padding:50px;
            background:#F3EEF1;
            color:#111111;
            border-radius:28px;
            border:1px solid #C2DC80;
        }
        .access-denied a{
            color:#D56989;
            text-decoration:none;
        }
        .access-denied a:hover{
            text-decoration:underline;
        }
        
        /* СТАТИСТИКА */
        .stats-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            margin-top: 10px;
        }
        .stat-card {
            background: #F3EEF1;
            border-radius: 24px;
            padding: 20px 12px;
            text-align: center;
            transition: transform 0.2s ease;
            border: 1px solid #C2DC80;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            background: #C2DC80;
        }
        .stat-card .stat-icon {
            font-size: 34px;
            margin-bottom: 10px;
            color: #D56989;
        }
        .stat-card .stat-label {
            font-size: 14px;
            letter-spacing: 1px;
            color: #111111;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 8px;
            opacity: 0.7;
        }
        .stat-card .stat-number {
            font-size: 34px;
            font-weight: 800;
            color: #D56989;
            line-height: 1.2;
        }
        .stat-card .stat-sub {
            font-size: 12px;
            color: #111111;
            margin-top: 6px;
            opacity: 0.6;
        }
        
        /* ТАБЫ */
        .tabs{
            display:flex;
            gap:8px;
            margin-bottom:25px;
            flex-wrap:wrap;
            border-bottom:2px solid #C2DC80;
            padding-bottom:5px;
        }
        .tab{
            background:none;
            border:none;
            padding:10px 24px;
            font-family:inherit;
            font-size:17px;
            font-weight:600;
            cursor:pointer;
            color:#111111;
            transition:.2s;
            border-radius:40px;
        }
        .tab.active{
            background:#C2DC80;
            color:#111111;
        }
        .tab:hover:not(.active){
            background:rgba(0,0,0,0.05);
        }
        
        /* ТАБЛИЦЫ */
        .table-wrapper{
            overflow-x:auto;
            margin:15px 0;
            border-radius:20px;
        }
        .data-table{
            width:100%;
            border-collapse:collapse;
            font-size:15px;
            background:#F3EEF1;
            border-radius:20px;
            overflow:hidden;
        }
        .data-table th,.data-table td{
            padding:12px 10px;
            border-bottom:1px solid #C2DC80;
            text-align:left;
            color:#111111;
        }
        .data-table th{
            background:#C2DC80;
            color:#111111;
            font-weight:700;
            font-size:16px;
        }
        .data-table tr:hover td{
            background:rgba(194,220,128,0.3);
        }
        
        /* БЭДЖИ И КНОПКИ */
        .badge-admin{
            background:#C2DC80;
            color:#111111;
            padding:4px 12px;
            font-size:12px;
            border-radius:40px;
        }
        .btn-small{
            background:#C2DC80;
            border:none;
            padding:6px 14px;
            font-family:inherit;
            font-size:13px;
            font-weight:600;
            cursor:pointer;
            color:#111111;
            margin:2px;
            border-radius:40px;
            transition:0.2s;
        }
        .btn-small:hover{
            background:#b8d16e;
            transform:scale(1.02);
        }
        .btn-danger{
            background:#D56989;
            color:#F3EEF1;
        }
        .btn-danger:hover{
            background:#b84d6e;
        }
        
        /* МОДАЛЬНЫЕ ОКНА */
        .modal{
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.7);
            z-index:1000;
            justify-content:center;
            align-items:center;
        }
        .modal-content{
            background:#F3EEF1;
            padding:28px;
            max-width:550px;
            width:90%;
            max-height:85vh;
            overflow-y:auto;
            border-radius:32px;
            border:2px solid #C2DC80;
        }
        .modal-content h3{
            color:#111111;
            font-size:28px;
            margin-bottom:20px;
            text-align:center;
        }
        .modal-content input,.modal-content select,.modal-content textarea{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #C2DC80;
            font-family:inherit;
            background:#F3EEF1;
            color:#111111;
            border-radius:16px;
            font-size:16px;
        }
        .modal-content textarea{
            min-height:100px;
            resize:vertical;
        }
        .modal-content button{
            background:#C2DC80;
            color:#111111;
            border:none;
            padding:12px;
            cursor:pointer;
            margin-top:10px;
            border-radius:40px;
            font-size:16px;
            font-weight:600;
            width:100%;
            transition:.2s;
        }
        .modal-content button:hover{
            background:#b8d16e;
            transform:scale(1.01);
        }
        
        /* ПОДВАЛ */
        .bottom-block{
            background:#F3EEF1;
            margin-top:40px;
            padding:25px 15px 20px;
            position:relative;
            border-radius:24px;
        }
        .bottom-block::before {
            display: none;
        }
        .footer-info{
            display:flex;
            justify-content:center;
            gap:25px;
            flex-wrap:wrap;
            margin:10px 0 22px;
            font-size:16px;
            text-align:center;
        }
        .footer-info span{
            font-size: 16px;
            font-weight: 500;
            color:#111111;
        }
        .social-links{
            display:flex;
            justify-content:center;
            gap:25px;
            flex-wrap:wrap;
            margin-bottom:18px;
        }
        .social-link{
            text-decoration:none;
            font-size:16px;
            padding:6px 16px;
            border-radius:40px;
            transition:.2s;
            font-weight: 500;
            color:#111111;
        }
        .social-link:hover{
            background:rgba(0,0,0,0.05);
        }
        .copyright{
            text-align:center;
            font-size:14px;
            margin-top:10px;
            color:#111111;
        }
        
        /* ВХОД В АДМИНКУ */
        .login-box{
            max-width:400px;
            margin:0 auto;
            background:#F3EEF1;
            border:1px solid #C2DC80;
            border-radius:28px;
            padding:30px;
            text-align:center;
        }
        .login-box h3{
            font-size:28px;
            margin-bottom:20px;
            color:#111111;
        }
        .login-box input{
            width:100%;
            padding:14px;
            margin:12px 0;
            border:1px solid #C2DC80;
            border-radius:40px;
            font-family:inherit;
            font-size:16px;
            background:#F3EEF1;
            color:#111111;
        }
        .login-box button{
            background:#C2DC80;
            color:#111111;
            border:none;
            padding:12px 30px;
            border-radius:40px;
            font-size:17px;
            font-weight:600;
            cursor:pointer;
            margin-top:15px;
            transition:.2s;
        }
        .login-box button:hover{
            background:#b8d16e;
            transform:scale(1.02);
        }
        
        .toast{
            position:fixed;
            bottom:20px;
            right:20px;
            left:20px;
            background:#1f5437;
            color:white;
            padding:14px;
            text-align:center;
            font-family:system-ui;
            font-size:14px;
            z-index:1001;
            animation:slideIn .3s ease;
            border-radius:40px;
        }
        @keyframes slideIn{
            from{transform:translateY(100%);opacity:0}
            to{transform:translateY(0);opacity:1}
        }
        
        @media(max-width:700px){
            .frame{padding:15px;border-radius:24px}
            .header{flex-direction:column;text-align:center}
            .nav{gap:12px}
            .tabs{gap:5px}
            .tab{padding:8px 16px;font-size:15px}
            .stat-number{font-size:28px}
            .admin-title{font-size:28px}
            .footer-info{flex-direction:column;gap:12px}
            .stats-dashboard{gap:12px}
            body{font-size:16px}
        }
    </style>
</head>
<body>
<div class="loading" id="loading" style="display:flex; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:9999; color:white; font-size:20px;">Загрузка...</div>

<div class="frame">
    <div class="header">
        <a href="index.html" class="logo">Estética Админ</a>
        <div class="nav">
            <a href="index.html">ГЛАВНАЯ</a>
            <a href="index2.html">КАТАЛОГ</a>
            <a href="index5.html">КОНТАКТЫ</a>
            <a href="index3.html">КОРЗИНА</a>
            <a href="index4.html">КАБИНЕТ</a>
        </div>
    </div>
    <h1 class="admin-title">Админ-панель</h1>
    
    <div id="ordersStatsPanel" class="stats-dashboard" style="display: none;"></div>

    <div class="tabs" id="tabs">
        <button class="tab active" onclick="switchTab('products')">Товары</button>
        <button class="tab" onclick="switchTab('promos')">Акции</button>
        <button class="tab" onclick="switchTab('reviews')">Отзывы</button>
        <button class="tab" onclick="switchTab('orders')">Заказы</button>
        <button class="tab" onclick="switchTab('messages')">Сообщения</button>
        <button class="tab" onclick="switchTab('users')">Пользователи</button>
    </div>
    
    <div id="adminContent"></div>
    
    <div class="bottom-block">
        <div class="footer-info">
            <span>Цветы, которых нет у других</span>
            <span>Эксклюзив в каждом стебле</span>
            <span>Скажут больше, чем слова</span>
        </div>
        <div class="social-links">
            <a href="https://vk.com" target="_blank" class="social-link">ВКонтакте</a>
            <a href="https://wa.me/79381112274" target="_blank" class="social-link">WhatsApp</a>
        </div>
        <div class="copyright">2026 Estética Цветочная мастерская</div>
    </div>
</div>

<div id="productModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Редактировать товар</h3>
        <input type="text" id="productName" placeholder="Название">
        <input type="number" id="productPrice" placeholder="Цена">
        <input type="text" id="productImg" placeholder="URL фото">
        <textarea id="productDesc" placeholder="Краткое описание"></textarea>
        <textarea id="productFullDesc" placeholder="Полное описание"></textarea>
        <select id="productCategory">
            <option value="bright">Яркие букеты</option>
            <option value="gentle">Нежные букеты</option>
            <option value="minimalism">Минимализм</option>
            <option value="single">Единичная позиция</option>
        </select>
        <button onclick="saveProduct()">Сохранить</button>
        <button onclick="closeModal()">Отмена</button>
    </div>
</div>

<div id="promoModal" class="modal">
    <div class="modal-content">
        <h3 id="promoModalTitle">Редактировать акцию</h3>
        <input type="text" id="promoName" placeholder="Название акции">
        <input type="text" id="promoDescription" placeholder="Описание">
        <input type="text" id="promoCategory" placeholder="Категория (bright/gentle/all)">
        <input type="number" id="promoDiscount" placeholder="Скидка">
        <button onclick="savePromo()">Сохранить</button>
        <button onclick="closePromoModal()">Отмена</button>
    </div>
</div>

<script>
const BIN_ID = '6a0e46146877513b27a708ce';
const MASTER_KEY = '$2a$10$HCH9Xf3UP6Dl1.e9yCDKeO2t9wmeo7tBLhtrewQUQb6YW2q5uQ.ju';
const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

let currentUser = null;
let editingProductId = null;
let editingPromoId = null;
let currentTab = 'products';

async function getData() {
    const res = await fetch(API_URL, { headers: { 'X-Master-Key': MASTER_KEY } });
    const data = await res.json();
    return data.record || { users: [], orders: [], messages: [], products: [], promos: [], reviews: [] };
}
async function saveData(data) {
    await fetch(API_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY }, body: JSON.stringify(data) });
}

async function login(email, password) {
    const data = await getData();
    const user = (data.users || []).find(u => u.email === email && u.password === password);
    if (user && user.isAdmin) {
        currentUser = user;
        localStorage.setItem('estetica_current_user', JSON.stringify(currentUser));
        return true;
    }
    return false;
}
async function getCurrentUser() {
    const saved = localStorage.getItem('estetica_current_user');
    if (saved && !currentUser) currentUser = JSON.parse(saved);
    return currentUser;
}
function logout() { currentUser = null; localStorage.removeItem('estetica_current_user'); renderMainContent(); }

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    renderMainContent();
}

function renderOrdersStatistics(orders) {
    const statsContainer = document.getElementById('ordersStatsPanel');
    if (!statsContainer) return;
    if (!orders || orders.length === 0) {
        statsContainer.style.display = 'none';
        return;
    }
    statsContainer.style.display = 'grid';
    
    const totalOrders = orders.length;
    const totalRevenue = orders.reduce((sum, o) => sum + (o.total || 0), 0);
    const newOrders = orders.filter(o => o.status === 'Новый').length;
    const processingOrders = orders.filter(o => o.status === 'В обработке').length;
    const deliveredOrders = orders.filter(o => o.status === 'Доставлен').length;
    const cancelledOrders = orders.filter(o => o.status === 'Отменён').length;
    const avgCheck = totalOrders > 0 ? (totalRevenue / totalOrders).toFixed(0) : 0;
    
    statsContainer.innerHTML = `
        <div class="stat-card"><div class="stat-icon">📦</div><div class="stat-label">Всего заказов</div><div class="stat-number">${totalOrders}</div><div class="stat-sub">за всё время</div></div>
        <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-label">Выручка</div><div class="stat-number">${totalRevenue.toLocaleString()} ₽</div><div class="stat-sub">общая сумма</div></div>
        <div class="stat-card"><div class="stat-icon">🆕</div><div class="stat-label">Новые</div><div class="stat-number">${newOrders}</div><div class="stat-sub">требуют внимания</div></div>
        <div class="stat-card"><div class="stat-icon">⚙️</div><div class="stat-label">В обработке</div><div class="stat-number">${processingOrders}</div><div class="stat-sub">готовятся</div></div>
        <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-label">Доставлено</div><div class="stat-number">${deliveredOrders}</div><div class="stat-sub">завершено</div></div>
        <div class="stat-card"><div class="stat-icon">📊</div><div class="stat-label">Средний чек</div><div class="stat-number">${avgCheck.toLocaleString()} ₽</div><div class="stat-sub">на 1 заказ</div></div>
        ${cancelledOrders > 0 ? `<div class="stat-card"><div class="stat-icon">❌</div><div class="stat-label">Отменено</div><div class="stat-number">${cancelledOrders}</div><div class="stat-sub"></div></div>` : ''}
    `;
}

// ========== ТОВАРЫ ==========
async function addProduct() {
    editingProductId = null;
    document.getElementById('modalTitle').innerText = 'Добавить товар';
    document.getElementById('productName').value = '';
    document.getElementById('productPrice').value = '';
    document.getElementById('productImg').value = '';
    document.getElementById('productDesc').value = '';
    document.getElementById('productFullDesc').value = '';
    document.getElementById('productCategory').value = 'bright';
    document.getElementById('productModal').style.display = 'flex';
}
function editProduct(p) {
    editingProductId = p.id;
    document.getElementById('modalTitle').innerText = 'Редактировать товар';
    document.getElementById('productName').value = p.name;
    document.getElementById('productPrice').value = p.price;
    document.getElementById('productImg').value = p.img;
    document.getElementById('productDesc').value = p.short_desc || '';
    document.getElementById('productFullDesc').value = p.full_desc || '';
    document.getElementById('productCategory').value = p.cat;
    document.getElementById('productModal').style.display = 'flex';
}
async function saveProduct() {
    const name = document.getElementById('productName').value.trim();
    const price = parseInt(document.getElementById('productPrice').value);
    const img = document.getElementById('productImg').value.trim();
    const short_desc = document.getElementById('productDesc').value.trim();
    const full_desc = document.getElementById('productFullDesc').value.trim();
    const cat = document.getElementById('productCategory').value;
    if (!name || !price || !img) { alert('Заполните название, цену и фото'); return; }
    const data = await getData();
    data.products = data.products || [];
    if (editingProductId === null) {
        const newId = Math.max(...data.products.map(p => p.id), 0) + 1;
        data.products.push({ id: newId, name, price, img, short_desc, full_desc, cat });
        showToast('Товар добавлен');
    } else {
        const idx = data.products.findIndex(p => p.id === editingProductId);
        if (idx !== -1) data.products[idx] = { ...data.products[idx], name, price, img, short_desc, full_desc, cat };
        showToast('Товар обновлён');
    }
    await saveData(data);
    closeModal();
    renderMainContent();
}
async function deleteProduct(id) {
    if (!confirm('Удалить товар?')) return;
    const data = await getData();
    data.products = (data.products || []).filter(p => p.id !== id);
    await saveData(data);
    showToast('Товар удалён');
    renderMainContent();
}

// ========== АКЦИИ ==========
async function addPromo() {
    editingPromoId = null;
    document.getElementById('promoModalTitle').innerText = 'Добавить акцию';
    document.getElementById('promoName').value = '';
    document.getElementById('promoDescription').value = '';
    document.getElementById('promoCategory').value = '';
    document.getElementById('promoDiscount').value = '';
    document.getElementById('promoModal').style.display = 'flex';
}
function editPromo(p) {
    editingPromoId = p.id;
    document.getElementById('promoModalTitle').innerText = 'Редактировать акцию';
    document.getElementById('promoName').value = p.name;
    document.getElementById('promoDescription').value = p.description || '';
    document.getElementById('promoCategory').value = p.category;
    document.getElementById('promoDiscount').value = p.discount;
    document.getElementById('promoModal').style.display = 'flex';
}
async function savePromo() {
    const name = document.getElementById('promoName').value.trim();
    const description = document.getElementById('promoDescription').value.trim();
    const category = document.getElementById('promoCategory').value.trim();
    const discount = parseInt(document.getElementById('promoDiscount').value);
    if (!name || !category || !discount) { alert('Заполните все поля'); return; }
    const data = await getData();
    data.promos = data.promos || [];
    if (editingPromoId === null) {
        const newId = Math.max(...data.promos.map(p => p.id), 0) + 1;
        data.promos.push({ id: newId, name, description, category, discount });
        showToast('Акция добавлена');
    } else {
        const idx = data.promos.findIndex(p => p.id === editingPromoId);
        if (idx !== -1) data.promos[idx] = { ...data.promos[idx], name, description, category, discount };
        showToast('Акция обновлена');
    }
    await saveData(data);
    closePromoModal();
    renderMainContent();
}
async function deletePromo(id) {
    if (!confirm('Удалить акцию?')) return;
    const data = await getData();
    data.promos = (data.promos || []).filter(p => p.id !== id);
    await saveData(data);
    showToast('Акция удалена');
    renderMainContent();
}

// ========== ОТЗЫВЫ ==========
async function deleteReview(id) {
    if (!confirm('Удалить отзыв?')) return;
    const data = await getData();
    data.reviews = (data.reviews || []).filter(r => r.id !== id);
    await saveData(data);
    showToast('Отзыв удалён');
    renderMainContent();
}
async function toggleReviewApproval(id, currentApproved) {
    const data = await getData();
    const reviews = data.reviews || [];
    const idx = reviews.findIndex(r => r.id === id);
    if (idx !== -1) {
        reviews[idx].approved = !currentApproved;
        data.reviews = reviews;
        await saveData(data);
        showToast(currentApproved ? 'Отзыв скрыт' : 'Отзыв опубликован');
        renderMainContent();
    }
}

// ========== ЗАКАЗЫ ==========
async function updateOrderStatus(orderId, newStatus) {
    const data = await getData();
    const orders = data.orders || [];
    const idx = orders.findIndex(o => o.id == orderId);
    if (idx !== -1) { orders[idx].status = newStatus; data.orders = orders; await saveData(data); showToast('Статус заказа обновлён'); renderMainContent(); }
}

// ========== ПОЛЬЗОВАТЕЛИ ==========
async function toggleAdmin(userId, currentIsAdmin) {
    const data = await getData();
    const users = data.users || [];
    const idx = users.findIndex(u => u.id === userId);
    if (idx !== -1) { users[idx].isAdmin = !currentIsAdmin; data.users = users; await saveData(data); showToast(currentIsAdmin ? 'Права админа сняты' : 'Пользователь назначен админом'); renderMainContent(); }
}

function closeModal() { document.getElementById('productModal').style.display = 'none'; editingProductId = null; }
function closePromoModal() { document.getElementById('promoModal').style.display = 'none'; editingPromoId = null; }
function showToast(msg) { let t = document.querySelector('.toast'); if(t) t.remove(); t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); }

async function renderMainContent() {
    await getCurrentUser();
    const container = document.getElementById('adminContent');
    const statsPanel = document.getElementById('ordersStatsPanel');
    
    if (!currentUser || !currentUser.isAdmin) {
        if(statsPanel) statsPanel.style.display = 'none';
        container.innerHTML = `<div class="access-denied"><h2>Доступ запрещён</h2><p><a href="index4.html">Вернуться в кабинет</a></p></div>`;
        document.getElementById('loading').style.display = 'none';
        return;
    }
    
    const data = await getData();
    const users = data.users || [];
    const orders = data.orders || [];
    const messages = data.messages || [];
    const products = data.products || [];
    const promos = data.promos || [];
    const reviews = data.reviews || [];
    
    renderOrdersStatistics(orders);
    
    if (currentTab === 'products') {
        let html = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;"><div style="font-size:22px; font-weight:600; color:#111111;">Каталог товаров (${products.length})</div><button class="btn-small" onclick="addProduct()" style="background:#1f5437; color:white;">+ Добавить товар</button></div>`;
        if (products.length === 0) html += '<div style="text-align:center;padding:40px;color:#111111;">Товаров пока нет</div>';
        else {
            html += `<div class="table-wrapper"><table class="data-table"><thead><tr><th>ID</th><th>Фото</th><th>Название</th><th>Цена</th><th>Категория</th><th>Действия</th></tr></thead><tbody>`;
            for (let p of products) {
                const catName = {bright:'Яркие', gentle:'Нежные', minimalism:'Минимализм', single:'Единичные'}[p.cat] || p.cat;
                html += `<tr>
                    <td>${p.id}</td>
                    <td><img src="${p.img}" style="width:45px;height:45px;object-fit:cover; border-radius:12px;"></td>
                    <td>${p.name}</td>
                    <td>${p.price} ₽</span></td>
                    <td>${catName}</td>
                    <td><button class="btn-small" onclick='editProduct(${JSON.stringify(p).replace(/'/g, "&#39;")})'>✏️</button>
                    <button class="btn-small btn-danger" onclick="deleteProduct(${p.id})">🗑</button></td>
                </tr>`;
            }
            html += `</tbody></table></div>`;
        }
        container.innerHTML = html;
    }
    else if (currentTab === 'promos') {
        let html = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;"><div style="font-size:22px; font-weight:600; color:#111111;">Акции (${promos.length})</div><button class="btn-small" onclick="addPromo()" style="background:#1f5437; color:white;">+ Добавить акцию</button></div>`;
        if (promos.length === 0) html += '<div style="text-align:center;padding:40px;color:#111111;">Акций пока нет</div>';
        else {
            html += `<div class="table-wrapper"><table class="data-table"><thead><tr><th>ID</th><th>Название</th><th>Описание</th><th>Категория</th><th>Скидка</th><th>Действия</th></tr></thead><tbody>`;
            for (let p of promos) {
                html += `<tr>
                    <td>${p.id}</td>
                    <td>${p.name}</td>
                    <td>${p.description || '-'}</td>
                    <td>${p.category}</td>
                    <td>${p.discount}%</span></td>
                    <td><button class="btn-small" onclick='editPromo(${JSON.stringify(p).replace(/'/g, "&#39;")})'>✏️</button>
                    <button class="btn-small btn-danger" onclick="deletePromo(${p.id})">🗑</button></td>
                </tr>`;
            }
            html += `</tbody></table></div>`;
        }
        container.innerHTML = html;
    }
    else if (currentTab === 'reviews') {
        let html = `<div style="font-size:22px; font-weight:600; color:#111111; margin-bottom:20px;">Отзывы (${reviews.length})</div>`;
        if (reviews.length === 0) html += '<div style="text-align:center;padding:40px;color:#111111;">Отзывов пока нет</div>';
        else {
            html += `<div class="table-wrapper"><table class="data-table"><thead><tr><th>Дата</th><th>Имя</th><th>Оценка</th><th>Текст</th><th>Статус</th><th>Действия</th></tr></thead><tbody>`;
            for (let r of reviews) {
                html += `<tr>
                    <td>${r.date}</td>
                    <td>${r.name}</td>
                    <td>${r.rating}★</span></td>
                    <td style="max-width:300px;">${r.text.substring(0, 100)}${r.text.length > 100 ? '...' : ''}</td>
                    <td>${r.approved !== false ? 'Опубликован' : 'Скрыт'}</td>
                    <td>
                        <button class="btn-small" onclick="toggleReviewApproval(${r.id}, ${r.approved !== false})">${r.approved !== false ? 'Скрыть' : 'Опубликовать'}</button>
                        <button class="btn-small btn-danger" onclick="deleteReview(${r.id})">Удалить</button>
                    </td>
                </tr>`;
            }
            html += `</tbody></table></div>`;
        }
        container.innerHTML = html;
    }
    else if (currentTab === 'orders') {
        let html = `<div style="font-size:22px; font-weight:600; color:#111111; margin-bottom:20px;">Управление заказами (${orders.length})</div>`;
        if (orders.length === 0) html += '<div style="text-align:center;padding:40px;color:#111111;">Заказов пока нет</div>';
        else {
            html += `<div class="table-wrapper"><table class="data-table"><thead><tr><th>ID</th><th>Дата</th><th>Покупатель</th><th>Товары</th><th>Сумма</th><th>Статус</th><th>Адрес</th><th>Действия</th></tr></thead><tbody>`;
            for (let o of orders) {
                html += `<tr>
                    <td>${o.id}</td>
                    <td>${o.date}</td>
                    <td>${o.userEmail || 'Гость'}</td>
                    <td>${o.items?.map(i => `${i.name} x${i.quantity}`).join('<br>') || '-'}</td>
                    <td>${o.total} ₽</span></td>
                    <td><select class="btn-small" onchange="updateOrderStatus(${o.id}, this.value)" style="background:#C2DC80; color:#111111; padding:6px 10px;">
                        <option value="Новый" ${o.status === 'Новый' ? 'selected' : ''}>Новый</option>
                        <option value="В обработке" ${o.status === 'В обработке' ? 'selected' : ''}>В обработке</option>
                        <option value="Доставлен" ${o.status === 'Доставлен' ? 'selected' : ''}>Доставлен</option>
                        <option value="Отменён" ${o.status === 'Отменён' ? 'selected' : ''}>Отменён</option>
                    </select></td>
                    <td>${o.address || '-'}</td>
                    <td><button class="btn-small btn-danger" onclick="updateOrderStatus(${o.id}, 'Отменён')">Отменить</button></td>
                </tr>`;
            }
            html += `</tbody></table></div>`;
        }
        container.innerHTML = html;
    }
    else if (currentTab === 'messages') {
        let html = `<div style="font-size:22px; font-weight:600; color:#111111; margin-bottom:20px;">Сообщения (${messages.length})</div>`;
        if (messages.length === 0) html += '<div style="text-align:center;padding:40px;color:#111111;">Сообщений пока нет</div>';
        else {
            html += `<div class="table-wrapper"><table class="data-table"><thead><tr><th>Дата</th><th>Имя</th><th>Email</th><th>Телефон</th><th>Сообщение</th></tr></thead><tbody>`;
            for (let m of messages) {
                html += `<tr>
                    <td>${m.date}</td>
                    <td>${m.name}</td>
                    <td>${m.email}</td>
                    <td>${m.phone || '-'}</td>
                    <td style="max-width:300px;">${m.message}</td>
                </tr>`;
            }
            html += `</tbody></table></div>`;
        }
        container.innerHTML = html;
    }
    else if (currentTab === 'users') {
        let html = `<div style="font-size:22px; font-weight:600; color:#111111; margin-bottom:20px;">Пользователи (${users.length})</div>`;
        if (users.length === 0) html += '<div style="text-align:center;padding:40px;color:#111111;">Пока нет пользователей</div>';
        else {
            html += `<div class="table-wrapper"><table class="data-table"><thead><tr><th>ID</th><th>Имя</th><th>Email</th><th>Телефон</th><th>Заказов</th><th>Статус</th><th>Действия</th></tr></thead><tbody>`;
            for (let u of users) {
                html += `<tr>
                    <td>${u.id}</td>
                    <td>${u.name}</td>
                    <td>${u.email}</td>
                    <td>${u.phone || '-'}</td>
                    <td>${u.orders?.length || 0}</td>
                    <td>${u.isAdmin ? '<span class="badge-admin">Админ</span>' : 'Пользователь'}</td>
                    <td><button class="btn-small" onclick="toggleAdmin(${u.id}, ${u.isAdmin})">${u.isAdmin ? 'Снять права' : 'Назначить админом'}</button></td>
                </tr>`;
            }
            html += `</tbody></table></div>`;
        }
        container.innerHTML = html;
    }
    
    document.getElementById('loading').style.display = 'none';
}

async function init() {
    const saved = localStorage.getItem('estetica_current_user');
    if (saved) {
        currentUser = JSON.parse(saved);
        const data = await getData();
        const freshUser = (data.users || []).find(u => u.id === currentUser.id);
        if (freshUser && freshUser.isAdmin) { currentUser = freshUser; renderMainContent(); return; }
    }
    const statsPanel = document.getElementById('ordersStatsPanel');
    if(statsPanel) statsPanel.style.display = 'none';
    document.getElementById('adminContent').innerHTML = `
        <div class="login-box">
            <h3>Вход в админ-панель</h3>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Пароль">
            <button onclick="doLogin()">Войти</button>
        </div>
    `;
    document.getElementById('loading').style.display = 'none';
}

window.doLogin = async function() {
    document.getElementById('loading').style.display = 'flex';
    const email = document.getElementById('loginEmail')?.value;
    const password = document.getElementById('loginPassword')?.value;
    if (await login(email, password)) renderMainContent();
    else { alert('Неверный email или пароль!'); document.getElementById('loading').style.display = 'none'; }
};

init();
</script>
