<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Личный кабинет | Estética</title>
    <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Poiret One',cursive;
            background:#D56989;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:15px;
            font-size:16px;
            color:#111111;
        }
        .frame{
            max-width:1300px;
            width:100%;
            background:#F3EEF1;
            padding:25px;
            border-radius:32px;
            border: 3px solid #C2DC80;
        }
        
        /* ШАПКА — ПРОЗРАЧНАЯ */
        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:15px;
            margin-bottom:25px;
            padding:20px 15px;
            background: transparent;
            position:relative;
            border-radius:24px;
        }
        .header::before {
            display: none;
        }
        
        .logo{
            font-size:32px;
            font-weight:800;
            text-decoration:none;
            letter-spacing:2px;
            color:#111111 !important;
        }
        
        .nav{
            display:flex;
            flex-wrap:wrap;
            gap:25px;
            justify-content:center;
        }
        .nav a{
            text-decoration:none;
            font-size:16px;
            font-weight:600;
            padding:8px 0;
            white-space:nowrap;
            transition:0.2s;
            letter-spacing:1px;
            color:#111111 !important;
        }
        .nav a:hover {
            background: rgba(0,0,0,0.05);
            border-radius:30px;
            padding:8px 12px;
        }
        
        .line{
            height:2px;
            background:#C2DC80;
            margin:20px 0;
            opacity:.5;
            border-radius:2px;
        }
        
        .page-title{
            font-size:32px;
            color:#111111;
            margin-bottom:20px;
            text-align:center;
            letter-spacing:2px;
        }
        
        /* ПРОФИЛЬ */
        .profile-card{
            background:#F3EEF1;
            border:1px solid #C2DC80;
            padding:25px;
            text-align:center;
            margin-bottom:25px;
            border-radius:24px;
        }
        .avatar{
            font-size:60px;
            margin-bottom:10px;
        }
        .profile-name{
            font-size:24px;
            font-weight:600;
            color:#111111;
        }
        .profile-email,.profile-phone{
            font-size:16px;
            color:#111111;
            margin:5px 0;
            opacity:0.8;
        }
        .profile-buttons{
            display:flex;
            justify-content:center;
            gap:10px;
            margin-top:15px;
            flex-wrap:wrap;
        }
        button{
            background:#C2DC80;
            border:none;
            padding:8px 20px;
            font-family:inherit;
            font-size:15px;
            cursor:pointer;
            color:#111111;
            border-radius:40px;
            transition:.2s;
            font-weight:600;
        }
        button:hover{
            background:#b8d16e;
            transform:scale(1.02);
        }
        .logout-btn{
            background:#D56989;
            color:#F3EEF1;
        }
        .logout-btn:hover{
            background:#b84d6e;
        }
        .admin-btn{
            background:#1f5437;
            color:#F3EEF1;
        }
        .admin-btn:hover{
            background:#2a6e48;
        }
        
        /* АВТОРИЗАЦИЯ */
        .auth-card{
            background:#F3EEF1;
            border:1px solid #C2DC80;
            padding:25px;
            max-width:400px;
            margin:0 auto 25px;
            border-radius:24px;
        }
        .auth-card h3{
            font-size:28px;
            color:#111111;
            text-align:center;
            margin-bottom:15px;
        }
        .input-group{
            position:relative;
            margin:10px 0;
        }
        .auth-input{
            width:100%;
            padding:12px;
            padding-right:40px;
            border:1px solid #C2DC80;
            background:#F3EEF1;
            font-family:inherit;
            font-size:15px;
            color:#111111;
            border-radius:16px;
        }
        .toggle-password{
            position:absolute;
            right:12px;
            top:50%;
            transform:translateY(-50%);
            background:none;
            border:none;
            cursor:pointer;
            font-size:16px;
            color:#111111;
            padding:0;
        }
        .auth-btn{
            width:100%;
            font-size:16px;
            margin-top:10px;
        }
        .switch-auth{
            margin-top:10px;
            text-align:center;
            font-size:13px;
            cursor:pointer;
            text-decoration:underline;
            color:#111111;
            opacity:0.7;
        }
        .switch-auth:hover{
            opacity:1;
        }
        
        /* ТАБЫ */
        .tabs{
            display:flex;
            gap:5px;
            margin-bottom:20px;
            border-bottom:2px solid #C2DC80;
        }
        .tab{
            flex:1;
            text-align:center;
            padding:10px;
            background:none;
            border:none;
            font-family:inherit;
            font-size:16px;
            cursor:pointer;
            color:#111111;
            border-radius:30px 30px 0 0;
            transition:.2s;
        }
        .tab.active{
            background:#C2DC80;
            color:#111111;
        }
        .tab-content{
            display:none;
        }
        .tab-content.active{
            display:block;
        }
        
        /* ЗАКАЗЫ */
        .order-item{
            background:#F3EEF1;
            border:1px solid #C2DC80;
            padding:15px;
            margin-bottom:12px;
            border-radius:20px;
        }
        .order-header{
            display:flex;
            justify-content:space-between;
            margin-bottom:8px;
            font-weight:bold;
            color:#111111;
        }
        .order-status{
            background:#D56989;
            color:#F3EEF1;
            padding:4px 12px;
            font-size:12px;
            border-radius:40px;
        }
        .order-details{
            font-size:14px;
            color:#111111;
            opacity:0.8;
        }
        .empty{
            text-align:center;
            padding:40px;
            color:#111111;
            font-size:16px;
        }
        .empty a{
            color:#D56989;
            text-decoration:none;
        }
        .empty a:hover{
            text-decoration:underline;
        }
        
        /* АДРЕСА */
        .address-item{
            background:#F3EEF1;
            border:1px solid #C2DC80;
            padding:12px 15px;
            margin-bottom:10px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-radius:20px;
        }
        .add-addr{
            background:#C2DC80;
            color:#111111;
            border:none;
            padding:8px 20px;
            cursor:pointer;
            border-radius:40px;
            margin-top:10px;
            font-size:15px;
        }
        .remove-btn{
            background:#D56989;
            color:#F3EEF1;
            border:none;
            padding:5px 15px;
            cursor:pointer;
            border-radius:40px;
            font-size:12px;
        }
        .remove-btn:hover{
            background:#b84d6e;
        }
        
        /* ПОДВАЛ */
        .bottom-block{
            background:#F3EEF1;
            margin-top:35px;
            padding:25px 15px 15px;
            position:relative;
            border-radius:24px;
        }
        .bottom-block::before {
            display: none;
        }
        .footer-info{
            display:flex;
            justify-content:center;
            gap:20px;
            flex-wrap:wrap;
            margin:10px 0 20px;
            font-size:15px;
            text-align:center;
        }
        .footer-info span{
            font-size: 15px;
            font-weight: 500;
            color:#111111;
        }
        .social-links{
            display:flex;
            justify-content:center;
            gap:20px;
            flex-wrap:wrap;
            margin-bottom:15px;
        }
        .social-link{
            text-decoration:none;
            font-size:15px;
            padding:6px 16px;
            border-radius:40px;
            transition:.2s;
            font-weight: 500;
            color:#111111;
        }
        .social-link:hover{
            background:rgba(0,0,0,0.05);
        }
        .copyright{
            text-align:center;
            font-size:13px;
            margin-top:8px;
            color:#111111;
        }
        
        @media(max-width:700px){
            .frame{padding:15px;border-radius:24px}
            .header{flex-direction:column;text-align:center}
            .nav{gap:12px}
            .profile-buttons{flex-direction:column;align-items:center}
            .profile-buttons button{width:100%;max-width:200px}
            .footer-info{flex-direction:column;gap:8px}
            .page-title{font-size:28px}
            .auth-card h3{font-size:24px}
        }
    </style>
</head>
<body>
<div class="frame">
    <div class="header">
        <a href="index.html" class="logo">Estética</a>
        <div class="nav">
            <a href="index.html">ГЛАВНАЯ</a>
            <a href="index2.html">КАТАЛОГ</a>
            <a href="index5.html">КОНТАКТЫ</a>
            <a href="index3.html">КОРЗИНА</a>
            <a href="index4.html">КАБИНЕТ</a>
        </div>
    </div>
    <div class="line"></div>
    <h1 class="page-title">Личный кабинет</h1>
    <div id="authBlock"></div>
    <div id="userPanel" style="display:none;">
        <div class="tabs">
            <button class="tab active" onclick="showTab('orders')">Заказы</button>
            <button class="tab" onclick="showTab('addresses')">Адреса</button>
        </div>
        <div id="tab-orders" class="tab-content active"><div id="ordersList"></div></div>
        <div id="tab-addresses" class="tab-content"><div id="addressesList"></div><button class="add-addr" onclick="addAddress()">+ Добавить адрес</button></div>
    </div>
    <div class="bottom-block">
        
        <div class="line"></div>
        
        <div class="footer-info">
            <span>Цветы, которых нет у других</span>
            <span>Эксклюзив в каждом стебле</span>
            <span>Скажут больше, чем слова</span>
        </div>
        <div class="social-links">
            <a href="https://vk.com" target="_blank" class="social-link">ВКонтакте</a>
            <a href="https://wa.me/79381112274" target="_blank" class="social-link">WhatsApp</a>
        </div>
        <div class="copyright">2026 Estética Цветочная мастерская</div>
    </div>
</div>

<script>
const BIN_ID = '6a0e46146877513b27a708ce';
const MASTER_KEY = '$2a$10$HCH9Xf3UP6Dl1.e9yCDKeO2t9wmeo7tBLhtrewQUQb6YW2q5uQ.ju';
const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

let currentUser = null;

async function getData() {
    const res = await fetch(API_URL, { headers: { 'X-Master-Key': MASTER_KEY } });
    const data = await res.json();
    return data.record || { users: [], orders: [], messages: [], products: [] };
}
async function saveData(data) {
    await fetch(API_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY }, body: JSON.stringify(data) });
}
async function register(email, password, name) {
    const data = await getData();
    let users = data.users || [];
    if (users.find(u => u.email === email)) return alert('Пользователь уже существует');
    const isAdmin = (email === 'ancord51217@gmail.com' && password === 'ananasik051217');
    const newUser = { id: Date.now(), email, password, name: name || email.split('@')[0], phone: 'не указан', addresses: ['Москва, ул. Нансена, 1'], orders: [], isAdmin };
    users.push(newUser);
    data.users = users;
    await saveData(data);
    currentUser = newUser;
    localStorage.setItem('estetica_current_user', JSON.stringify(currentUser));
    alert(isAdmin ? 'Вы администратор' : 'Регистрация успешна');
    renderAuthScreen();
    return true;
}
async function login(email, password) {
    const data = await getData();
    const user = (data.users || []).find(u => u.email === email && u.password === password);
    if (user) {
        currentUser = user;
        localStorage.setItem('estetica_current_user', JSON.stringify(currentUser));
        alert(`Добро пожаловать, ${user.name}!`);
        renderAuthScreen();
        return true;
    }
    alert('Неверный email или пароль');
    return false;
}
function logout() {
    currentUser = null;
    localStorage.removeItem('estetica_current_user');
    renderAuthScreen();
    alert('Вы вышли');
}
async function updateUserData(updates) {
    if (!currentUser) return;
    const data = await getData();
    const users = data.users || [];
    const idx = users.findIndex(u => u.id === currentUser.id);
    if (idx !== -1) {
        users[idx] = { ...users[idx], ...updates };
        data.users = users;
        await saveData(data);
        currentUser = users[idx];
        localStorage.setItem('estetica_current_user', JSON.stringify(currentUser));
        renderAuthScreen();
        alert('Профиль обновлён');
    }
}
function togglePassword(id) { let i = document.getElementById(id); i.type = i.type === 'password' ? 'text' : 'password'; }
async function renderAuthScreen() {
    const saved = localStorage.getItem('estetica_current_user');
    if (saved && !currentUser) currentUser = JSON.parse(saved);
    const auth = document.getElementById('authBlock');
    const panel = document.getElementById('userPanel');
    if (!currentUser) {
        auth.innerHTML = `<div class="auth-card"><div id="authForm"><h3>Вход</h3><div class="input-group"><input type="email" id="loginEmail" class="auth-input" placeholder="Email"></div><div class="input-group"><input type="password" id="loginPassword" class="auth-input" placeholder="Пароль"><button class="toggle-password" onclick="togglePassword('loginPassword')">👁</button></div><button class="auth-btn" onclick="doLogin()">Войти</button><div class="switch-auth" onclick="showRegisterForm()">Нет аккаунта? Зарегистрироваться</div></div></div>`;
        panel.style.display = 'none';
    } else {
        const adminBtn = currentUser.isAdmin ? `<button class="admin-btn" onclick="location.href='admin.html'">Админ-панель</button>` : '';
        auth.innerHTML = `<div class="profile-card"><div class="avatar">🌸</div><div class="profile-name">${currentUser.name}</div><div class="profile-email">${currentUser.email}</div><div class="profile-phone">${currentUser.phone || 'не указан'}</div><div class="profile-buttons"><button onclick="editProfile()">Редактировать</button><button class="logout-btn" onclick="logout()">Выйти</button>${adminBtn}</div></div>`;
        panel.style.display = 'block';
        loadOrders();
        loadAddresses();
    }
}
window.showRegisterForm = function() {
    document.getElementById('authForm').innerHTML = `<h3>Регистрация</h3><div class="input-group"><input type="text" id="regName" class="auth-input" placeholder="Ваше имя"></div><div class="input-group"><input type="email" id="regEmail" class="auth-input" placeholder="Email"></div><div class="input-group"><input type="password" id="regPassword" class="auth-input" placeholder="Пароль"><button class="toggle-password" onclick="togglePassword('regPassword')">👁</button></div><button class="auth-btn" onclick="doRegister()">Зарегистрироваться</button><div class="switch-auth" onclick="showLoginForm()">Уже есть аккаунт? Войти</div>`;
};
window.showLoginForm = function() {
    document.getElementById('authForm').innerHTML = `<h3>Вход</h3><div class="input-group"><input type="email" id="loginEmail" class="auth-input" placeholder="Email"></div><div class="input-group"><input type="password" id="loginPassword" class="auth-input" placeholder="Пароль"><button class="toggle-password" onclick="togglePassword('loginPassword')">👁</button></div><button class="auth-btn" onclick="doLogin()">Войти</button><div class="switch-auth" onclick="showRegisterForm()">Нет аккаунта? Зарегистрироваться</div>`;
};
window.doLogin = async function() { let e = document.getElementById('loginEmail')?.value, p = document.getElementById('loginPassword')?.value; if (e && p && await login(e, p)) renderAuthScreen(); else alert('Заполните поля'); };
window.doRegister = async function() { let n = document.getElementById('regName')?.value, e = document.getElementById('regEmail')?.value, p = document.getElementById('regPassword')?.value; if (n && e && p && await register(e, p, n)) renderAuthScreen(); else alert('Заполните поля'); };
window.editProfile = function() {
    if (!currentUser) return;
    const n = prompt('Новое имя:', currentUser.name);
    const ph = prompt('Новый телефон:', currentUser.phone || '');
    const upd = {};
    if (n) upd.name = n;
    if (ph) upd.phone = ph;
    if (Object.keys(upd).length) updateUserData(upd);
};
async function loadOrders() {
    if (!currentUser) return;
    const data = await getData();
    const user = (data.users || []).find(u => u.id === currentUser.id);
    const orders = user?.orders || [];
    const container = document.getElementById('ordersList');
    if (!orders.length) { container.innerHTML = '<div class="empty">Заказов пока нет<br><a href="index2.html">Перейти в каталог</a></div>'; return; }
    container.innerHTML = orders.map(o => `<div class="order-item"><div class="order-header"><span>${o.date}</span><span class="order-status">${o.status || 'Новый'}</span></div><div class="order-details">${o.items?.map(i => `${i.name} x ${i.quantity}`).join(', ') || ''}</div><div class="order-details">${o.total} ₽ | ${o.address || ''}</div></div>`).join('');
}
function loadAddresses() {
    const container = document.getElementById('addressesList');
    const addresses = currentUser?.addresses || ['Москва, ул. Нансена, 1'];
    container.innerHTML = addresses.map((a, i) => `<div class="address-item"><span>${a}</span><button class="remove-btn" onclick="deleteAddress(${i})">Удалить</button></div>`).join('');
}
async function addAddress() {
    const a = prompt('Новый адрес:');
    if (a?.trim()) {
        const addresses = [...(currentUser?.addresses || []), a.trim()];
        await updateUserData({ addresses });
        loadAddresses();
    }
}
async function deleteAddress(i) {
    const addresses = [...(currentUser?.addresses || [])];
    addresses.splice(i, 1);
    await updateUserData({ addresses });
    loadAddresses();
}
window.showTab = function(t) {
    document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(`tab-${t}`).classList.add('active');
    if (t === 'orders') loadOrders();
    if (t === 'addresses') loadAddresses();
};
renderAuthScreen();
</script>
</body>
</html>
