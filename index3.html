<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Корзина | Estética · Оплата заказа</title>
    <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poiret One', cursive;
            background: #D56989;
            padding: 15px;
            font-size: 16px;
            color: #111111;
        }

        .frame {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            background: #F3EEF1;
            padding: 25px;
            border-radius: 32px;
            border: 3px solid #C2DC80;
        }

        /* ШАПКА — ПРОЗРАЧНАЯ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding: 20px 15px;
            background: transparent;
            position: relative;
            border-radius: 24px;
        }
        .header::before {
            display: none;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: 2px;
            color: #111111 !important;
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
        }
        .nav a {
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            padding: 8px 0;
            white-space: nowrap;
            transition: 0.2s;
            letter-spacing: 1px;
            color: #111111 !important;
        }
        .nav a:hover {
            background: rgba(0,0,0,0.05);
            border-radius: 30px;
            padding: 8px 12px;
        }

        .line {
            height: 2px;
            background: #C2DC80;
            margin: 20px 0;
            opacity: .5;
            border-radius: 2px;
        }

        .cart-title {
            font-size: 32px;
            color: #111111;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 2px;
        }

        /* ТАБЛИЦА КОРЗИНЫ */
        .cart-container {
            overflow-x: auto;
            margin: 15px 0;
        }

        .cart-table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
            background: #F3EEF1;
            border-radius: 20px;
            overflow: hidden;
        }

        .cart-table th,
        .cart-table td {
            padding: 15px 10px;
            text-align: center;
            border-bottom: 1px solid #C2DC80;
            vertical-align: middle;
        }

        .cart-table th {
            background: #C2DC80;
            color: #111111;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .cart-table td {
            font-size: 15px;
            color: #111111;
        }

        .cart-product-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .product-name {
            font-weight: 600;
            color: #111111;
            font-size: 16px;
        }

        .quantity-btn {
            background: #C2DC80;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            color: #111111;
            transition: .2s;
            margin: 0 5px;
        }

        .quantity-btn:hover {
            background: #b8d16e;
            transform: scale(1.05);
        }

        .quantity-num {
            font-size: 16px;
            font-weight: 600;
            margin: 0 8px;
            display: inline-block;
            min-width: 24px;
            color: #111111;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #D56989;
            font-size: 22px;
            cursor: pointer;
            transition: .2s;
        }

        .remove-btn:hover {
            color: #b84d6e;
            transform: scale(1.1);
        }

        .cart-summary {
            text-align: right;
            padding: 20px;
            background: #C2DC80;
            margin: 20px 0;
            border-radius: 20px;
        }

        .cart-summary .total-label {
            font-size: 18px;
            color: #111111;
            margin-right: 15px;
        }

        .cart-summary .total-price {
            font-size: 32px;
            font-weight: bold;
            color: #111111;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            color: #111111;
            font-size: 22px;
        }

        .empty-cart .continue-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #C2DC80;
            color: #111111;
            text-decoration: none;
            border-radius: 40px;
            font-size: 16px;
            transition: .2s;
        }

        .empty-cart .continue-btn:hover {
            background: #b8d16e;
            transform: scale(1.02);
        }

        /* ФОРМА ОФОРМЛЕНИЯ */
        .form-section {
            margin-top: 30px;
            padding: 25px;
            background: #F3EEF1;
            border: 2px solid #C2DC80;
            border-radius: 28px;
        }

        .form-title {
            font-size: 28px;
            color: #111111;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-group label {
            font-size: 14px;
            font-weight: 600;
            color: #111111;
        }

        .field-group input {
            padding: 12px;
            border: 1px solid #C2DC80;
            border-radius: 16px;
            background: #F3EEF1;
            font-family: inherit;
            font-size: 15px;
            color: #111111;
            transition: .2s;
        }

        .field-group input:focus {
            outline: none;
            border-color: #D56989;
            box-shadow: 0 0 0 2px rgba(213, 105, 137, 0.2);
        }

        .info-text {
            background: #C2DC80;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
            color: #111111;
            font-size: 15px;
            border-radius: 20px;
        }

        .submit-order-btn {
            background: #C2DC80;
            border: none;
            color: #111111;
            font-size: 18px;
            padding: 14px 35px;
            cursor: pointer;
            display: block;
            margin: 20px auto 0;
            border-radius: 40px;
            transition: .2s;
            font-family: inherit;
            font-weight: bold;
        }

        .submit-order-btn:hover {
            background: #b8d16e;
            transform: scale(1.02);
        }

        /* ПОДВАЛ */
        .bottom-block {
            background: #F3EEF1;
            margin-top: 35px;
            padding: 25px 15px 15px;
            position: relative;
            border-radius: 24px;
        }
        .bottom-block::before {
            display: none;
        }
        .footer-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 10px 0 20px;
            font-size: 15px;
            text-align: center;
        }
        .footer-info span {
            font-size: 15px;
            font-weight: 500;
            color: #111111;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .social-link {
            text-decoration: none;
            font-size: 15px;
            padding: 6px 16px;
            border-radius: 40px;
            transition: .2s;
            font-weight: 500;
            color: #111111;
        }
        .social-link:hover {
            background: rgba(0,0,0,0.05);
        }
        .copyright {
            text-align: center;
            font-size: 13px;
            margin-top: 8px;
            color: #111111;
        }

        /* МОДАЛЬНОЕ ОКНО ОПЛАТЫ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .payment-modal {
            background: #F3EEF1;
            max-width: 480px;
            width: 90%;
            border-radius: 32px;
            padding: 28px 24px 32px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
            border: 2px solid #C2DC80;
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            font-family: 'Poiret One', cursive;
        }

        .modal-overlay.active .payment-modal {
            transform: scale(1);
        }

        .payment-modal h3 {
            font-size: 28px;
            color: #111111;
            text-align: center;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .payment-amount {
            background: #C2DC80;
            padding: 12px;
            text-align: center;
            border-radius: 60px;
            font-size: 24px;
            font-weight: bold;
            color: #111111;
            margin-bottom: 28px;
        }

        .card-field {
            margin-bottom: 20px;
        }

        .card-field label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #111111;
            margin-bottom: 6px;
        }

        .card-field input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #C2DC80;
            border-radius: 48px;
            background: white;
            font-size: 16px;
            font-family: monospace;
            letter-spacing: 0.5px;
            transition: 0.2s;
        }

        .card-field input:focus {
            outline: none;
            border-color: #D56989;
            box-shadow: 0 0 0 2px rgba(213, 105, 137, 0.2);
        }

        .row-fields {
            display: flex;
            gap: 15px;
        }

        .row-fields .card-field {
            flex: 1;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .pay-btn {
            flex: 2;
            background: #C2DC80;
            border: none;
            padding: 14px 0;
            border-radius: 60px;
            color: #111111;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Poiret One', cursive;
        }

        .pay-btn:hover {
            background: #b8d16e;
            transform: scale(1.02);
        }

        .cancel-pay-btn {
            flex: 1;
            background: #D56989;
            border: none;
            padding: 14px 0;
            border-radius: 60px;
            color: #F3EEF1;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Poiret One', cursive;
        }

        .cancel-pay-btn:hover {
            background: #b84d6e;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            background: #1f5437;
            color: #F3EEF1;
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: bold;
            z-index: 2100;
            font-family: system-ui, 'Poiret One', cursive;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
            text-align: center;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 550px) {
            .toast {
                font-size: 13px;
                white-space: normal;
                width: 85%;
                text-align: center;
                padding: 12px 20px;
            }
            .row-fields {
                flex-direction: column;
                gap: 12px;
            }
            .cart-title {
                font-size: 28px;
            }
            .form-title {
                font-size: 24px;
            }
            .cart-summary .total-price {
                font-size: 28px;
            }
        }
        @media (max-width: 700px) {
            .frame {
                padding: 15px;
                border-radius: 24px;
            }
            .header {
                flex-direction: column;
                text-align: center;
            }
            .nav {
                gap: 12px;
            }
        }
    </style>
</head>
<body>
<div class="frame">
    <div class="header">
        <a href="index.html" class="logo">Estética</a>
        <div class="nav">
            <a href="index.html">ГЛАВНАЯ</a>
            <a href="index2.html">КАТАЛОГ</a>
            <a href="index5.html">КОНТАКТЫ</a>
            <a href="index3.html">КОРЗИНА</a>
            <a href="index4.html">КАБИНЕТ</a>
        </div>
    </div>

    <div class="line"></div>
    <h1 class="cart-title">Корзина</h1>

    <div id="cartContent"></div>
    <div id="orderSection" style="display:none;">
        <div class="form-section">
            <div class="form-title">Детали доставки</div>
            <div class="form-grid">
                <div class="field-group"><label>Ваше имя *</label><input type="text" id="userName" placeholder="Иван Иванов"></div>
                <div class="field-group"><label>Имя получателя</label><input type="text" id="recipientName" placeholder="Имя получателя"></div>
                <div class="field-group"><label>Ваш телефон *</label><input type="tel" id="userPhone" placeholder="+7 (___) ___-__-__"></div>
                <div class="field-group"><label>Телефон получателя</label><input type="tel" id="recipientPhone" placeholder="+7 (___) ___-__-__"></div>
                <div class="field-group"><label>Адрес доставки *</label><input type="text" id="address" placeholder="Улица, дом, квартира"></div>
                <div class="field-group"><label>Время доставки</label><input type="text" id="deliveryTime" placeholder="14:00"></div>
                <div class="field-group"><label>Дата доставки</label><input type="text" id="deliveryDate" placeholder="27.05.2026"></div>
                <div class="field-group"><label>Комментарий</label><input type="text" id="comment" placeholder="Пожелания к букету"></div>
            </div>
            <div class="info-text">🌸 После оформления заказа вы перейдете к безопасной оплате картой</div>
            <button class="submit-order-btn" id="openPaymentModalBtn">Оформить заказ и оплатить</button>
        </div>
    </div>

    <div class="bottom-block">
        <div class="footer-info">
            <span>Цветы, которых нет у других</span>
            <span>Эксклюзив в каждом стебле</span>
            <span>Скажут больше, чем слова</span>
        </div>
        <div class="social-links">
            <a href="https://vk.com" target="_blank" class="social-link">ВКонтакте</a>
            <a href="https://wa.me/79381112274" target="_blank" class="social-link">WhatsApp</a>
        </div>
        <div class="copyright">2026 Estética Цветочная мастерская</div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ОПЛАТЫ -->
<div id="paymentModal" class="modal-overlay">
    <div class="payment-modal">
        <h3>Оплата заказа</h3>
        <div id="modalTotalAmount" class="payment-amount">0 ₽</div>
        <div class="card-field">
            <label>Номер карты</label>
            <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19">
        </div>
        <div class="row-fields">
            <div class="card-field">
                <label>Срок (MM/YY)</label>
                <input type="text" id="cardExpiry" placeholder="12/28" maxlength="5">
            </div>
            <div class="card-field">
                <label>CVC / CVV</label>
                <input type="password" id="cardCvv" placeholder="***" maxlength="4">
            </div>
        </div>
        <div class="card-field">
            <label>Владелец карты</label>
            <input type="text" id="cardHolder" placeholder="IVAN IVANOV">
        </div>
        <div class="modal-buttons">
            <button class="cancel-pay-btn" id="closeModalBtn">Отмена</button>
            <button class="pay-btn" id="confirmPayBtn">Оплатить</button>
        </div>
    </div>
</div>

<script>
    // ------------------ РАБОТА С КОРЗИНОЙ ------------------
    function getCart() { return JSON.parse(localStorage.getItem('estetica_cart') || '[]'); }
    function saveCart(c) { localStorage.setItem('estetica_cart', JSON.stringify(c)); updateCartCount(); renderCart(); }
    function updateCartCount() {
        let total = getCart().reduce((s, i) => s + i.quantity, 0);
        let link = document.querySelector('.nav a[href="index3.html"]');
        if (link) link.innerHTML = total > 0 ? `КОРЗИНА (${total})` : `КОРЗИНА`;
    }
    function showToastMessage(message, isSuccess = true) {
        let existingToast = document.querySelector('.toast');
        if (existingToast) existingToast.remove();
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        toast.style.background = isSuccess ? '#1f5437' : '#b84d6e';
        document.body.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 400);
        }, 3200);
    }

    function updateQuantity(id, delta) {
        let cart = getCart();
        let idx = cart.findIndex(i => i.id === id);
        if (idx !== -1) {
            cart[idx].quantity += delta;
            if (cart[idx].quantity <= 0) cart.splice(idx, 1);
            saveCart(cart);
        }
    }
    function removeItem(id) {
        let cart = getCart();
        cart = cart.filter(i => i.id !== id);
        saveCart(cart);
    }

    function renderCart() {
        const cart = getCart();
        const container = document.getElementById('cartContent');
        const orderSec = document.getElementById('orderSection');

        if (cart.length === 0) {
            container.innerHTML = `<div class="empty-cart">Корзина пуста<br><a href="index2.html" class="continue-btn">В каталог</a></div>`;
            orderSec.style.display = 'none';
            return;
        }
        orderSec.style.display = 'block';

        let total = 0;
        let rows = '';
        for (let item of cart) {
            const itemTotal = item.price * item.quantity;
            total += itemTotal;
            rows += `
                <tr>
                    <td><img src="${item.img}" class="cart-product-img" alt="${item.name}"></td>
                    <td class="product-name">${item.name}</td>
                    <td>${item.price} ₽</td>
                    <td>
                        <button class="quantity-btn" onclick="updateQuantity(${item.id}, -1)">−</button>
                        <span class="quantity-num">${item.quantity}</span>
                        <button class="quantity-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                    </td>
                    <td><strong>${itemTotal} ₽</strong></td>
                    <td><button class="remove-btn" onclick="removeItem(${item.id})">✕</button></td>
                </tr>
            `;
        }

        container.innerHTML = `
            <div class="cart-container">
                <table class="cart-table">
                    <thead>
                        <tr><th>Товар</th><th>Название</th><th>Цена</th><th>Количество</th><th>Сумма</th><th></th></tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>
            <div class="cart-summary">
                <span class="total-label">Итого:</span>
                <span class="total-price" id="cartTotalPrice">${total} ₽</span>
            </div>
        `;
        window.currentCartTotal = total;
    }

    // ---------- ИМИТАЦИЯ СОХРАНЕНИЯ ЗАКАЗА (JSONBin) ----------
    const BIN_ID = '6a0e46146877513b27a708ce';
    const MASTER_KEY = '$2a$10$HCH9Xf3UP6Dl1.e9yCDKeO2t9wmeo7tBLhtrewQUQb6YW2q5uQ.ju';
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    async function getData() {
        try {
            const res = await fetch(API_URL, { headers: { 'X-Master-Key': MASTER_KEY } });
            const data = await res.json();
            return data.record || { users: [], orders: [], messages: [], products: [] };
        } catch (e) {
            console.warn("Ошибка чтения JSONBin, но заказ будет эмулирован");
            return { orders: [] };
        }
    }
    async function saveData(data) {
        try {
            await fetch(API_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY }, body: JSON.stringify(data) });
            return true;
        } catch (e) {
            console.warn("Ошибка сохранения, но заказ виртуально сохранен");
            return false;
        }
    }

    async function saveOrderToJSONBin(orderData) {
        const data = await getData();
        data.orders = data.orders || [];
        data.orders.unshift(orderData);
        return await saveData(data);
    }

    // ОСНОВНАЯ ЛОГИКА: ПОКАЗ МОДАЛКИ ОПЛАТЫ ПОСЛЕ ПРОВЕРКИ ФОРМЫ
    function showPaymentModal() {
        const cart = getCart();
        if (cart.length === 0) {
            showToastMessage("Корзина пуста, невозможно оформить заказ", false);
            return false;
        }
        const name = document.getElementById('userName')?.value.trim();
        const phone = document.getElementById('userPhone')?.value.trim();
        const address = document.getElementById('address')?.value.trim();
        if (!name || !phone || !address) {
            showToastMessage("Заполните имя, телефон и адрес доставки", false);
            return false;
        }

        const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
        document.getElementById('modalTotalAmount').innerText = `${total} ₽`;
        document.getElementById('cardNumber').value = '';
        document.getElementById('cardExpiry').value = '';
        document.getElementById('cardCvv').value = '';
        document.getElementById('cardHolder').value = '';

        const modal = document.getElementById('paymentModal');
        modal.classList.add('active');
        return true;
    }

    function closePaymentModal() {
        const modal = document.getElementById('paymentModal');
        modal.classList.remove('active');
    }

    async function processPaymentAndCompleteOrder() {
        const cardNumber = document.getElementById('cardNumber').value.replace(/\s/g, '');
        const cardExpiry = document.getElementById('cardExpiry').value.trim();
        const cardCvv = document.getElementById('cardCvv').value.trim();
        const cardHolder = document.getElementById('cardHolder').value.trim().toUpperCase();

        if (!cardNumber || cardNumber.length < 13) {
            showToastMessage("Введите корректный номер карты", false);
            return;
        }
        if (!cardExpiry || !cardExpiry.match(/^\d{2}\/\d{2}$/)) {
            showToastMessage("Формат срока: MM/YY", false);
            return;
        }
        if (!cardCvv || cardCvv.length < 3) {
            showToastMessage("Введите CVV код (3-4 цифры)", false);
            return;
        }
        if (!cardHolder) {
            showToastMessage("Укажите владельца карты", false);
            return;
        }

        const paymentSuccess = true;

        if (!paymentSuccess) {
            showToastMessage("Ошибка оплаты, попробуйте другую карту", false);
            return;
        }

        closePaymentModal();

        const cart = getCart();
        if (cart.length === 0) {
            showToastMessage("Корзина стала пуста, повторите оформление", false);
            return;
        }

        const name = document.getElementById('userName').value.trim();
        const phone = document.getElementById('userPhone').value.trim();
        const address = document.getElementById('address').value.trim();
        const recipientName = document.getElementById('recipientName').value.trim();
        const recipientPhone = document.getElementById('recipientPhone').value.trim();
        const deliveryTime = document.getElementById('deliveryTime').value.trim();
        const deliveryDate = document.getElementById('deliveryDate').value.trim();
        const comment = document.getElementById('comment').value.trim();
        const totalSum = cart.reduce((s, i) => s + i.price * i.quantity, 0);

        const orderData = {
            id: Date.now(),
            date: new Date().toLocaleString('ru-RU'),
            userName: name,
            userPhone: phone,
            address: address,
            recipientName: recipientName,
            recipientPhone: recipientPhone,
            deliveryTime: deliveryTime,
            deliveryDate: deliveryDate,
            comment: comment,
            items: cart.map(i => ({ id: i.id, name: i.name, price: i.price, quantity: i.quantity, img: i.img })),
            total: totalSum,
            status: 'Оплачен (онлайн)',
            paymentMethod: 'card_online'
        };

        let saved = await saveOrderToJSONBin(orderData);
        if (!saved) {
            console.warn("Не удалось синхронизировать с JSONBin, но заказ локально создан");
        }

        localStorage.removeItem('estetica_cart');
        renderCart();
        updateCartCount();

        const inputs = document.querySelectorAll('#orderSection input');
        inputs.forEach(inp => inp.value = '');

        showToastMessage(`Оплата прошла успешно! Сумма ${totalSum} ₽. Спасибо за покупку!`, true);
    }

    function attachModalTriggers() {
        const openBtn = document.getElementById('openPaymentModalBtn');
        if (openBtn) {
            const newBtn = openBtn.cloneNode(true);
            openBtn.parentNode.replaceChild(newBtn, openBtn);
            newBtn.addEventListener('click', (e) => {
                e.preventDefault();
                showPaymentModal();
            });
        }
        const closeModalBtn = document.getElementById('closeModalBtn');
        if (closeModalBtn) {
            closeModalBtn.addEventListener('click', closePaymentModal);
        }
        const confirmBtn = document.getElementById('confirmPayBtn');
        if (confirmBtn) {
            const cloned = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(cloned, confirmBtn);
            cloned.addEventListener('click', processPaymentAndCompleteOrder);
        }
        const overlay = document.getElementById('paymentModal');
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closePaymentModal();
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderCart();
        attachModalTriggers();
    });
</script>
</body>
</html>
